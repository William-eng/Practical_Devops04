apiVersion: v1
kind: Pod
metadata:
  name: ebs-test
  namespace: task-manager
spec:
  containers:
    - name: tester
      image: busybox:1.36
      command: ["sh", "-c", "echo 'EBS storage works' > /data/test.txt; sleep 3600"]
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: ebs-test-pvc
