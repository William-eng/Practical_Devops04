grafana:
  enabled: true

  service:
    type: ClusterIP

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

prometheus:
  prometheusSpec:
    retention: 6h

    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        memory: 1Gi

    storageSpec:
      emptyDir:
        sizeLimit: 2Gi

alertmanager:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
